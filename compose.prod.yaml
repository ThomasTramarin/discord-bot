# Simulate a production deployment
version: "3"
services:
  bot:
    container_name: discord-bot
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    restart: unless-stopped
    depends_on:
      - db

  db:
    container_name: postgres
    restart: unless-stopped
    image: postgres
    env_file: .env
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
